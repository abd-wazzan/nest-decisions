name: Release

# On every push to main, the Changesets action either:
#   - opens or updates a "chore: version packages" pull request when unreleased changesets exist, or
#   - STAGES the new versions on npm, with provenance, when that pull request has just been merged.
#
# Nothing is public until a maintainer approves each staged version with 2FA (`npm stage approve`).
# npm is removing direct publishing with granular tokens in January 2027, so CI only stages.
#
# Two jobs, so the job that holds publish credentials is small and runs no install scripts.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Optional hardening: create an environment named "release" in the repository settings and
    # require a reviewer, so publishing needs a human approval.
    environment: release
    permissions:
      contents: write # tags and GitHub releases
      pull-requests: write # the version pull request
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # `npm stage` needs npm 11.15 or newer.
      - run: npm install -g npm@latest
      # No dependency lifecycle scripts run in the job that holds the token.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          createGithubReleases: false
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A granular npm token with "Read and write (stage only)" on the @nest-decisions scope.
          # It can stage new versions but cannot publish them: a maintainer approves with 2FA.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
