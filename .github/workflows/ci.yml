name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / Nest ${{ matrix.nest }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real Redis for the adapter integration tests (budget store, cache, review queue).
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        nest: [12]
        include:
          # Older supported Nest majors on the newest Node, to keep the peer range honest.
          - node: 24
            nest: 10
          - node: 24
            nest: 11
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pin Nest ${{ matrix.nest }}
        if: matrix.nest != 12
        run: >
          pnpm add -wD --no-frozen-lockfile
          @nestjs/common@^${{ matrix.nest }}.0.0 @nestjs/core@^${{ matrix.nest }}.0.0
          @nestjs/testing@^${{ matrix.nest }}.0.0 @nestjs/platform-express@^${{ matrix.nest }}.0.0
          @nestjs/platform-fastify@^${{ matrix.nest }}.0.0
      - run: pnpm lint
        if: matrix.nest == 12 && matrix.node == 24
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:dist

  package-quality:
    name: Package quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: publint and are-the-types-wrong
        run: |
          for pkg in core testing provider-jev; do
            (cd packages/$pkg && npx --yes publint --pack npm --strict && npx --yes @arethetypeswrong/cli --pack . --ignore-rules cjs-resolves-to-esm)
          done

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -r --if-present test:cov
