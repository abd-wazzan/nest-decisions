name: Docs

# Builds the documentation site on every pull request (so a dead link fails review) and deploys it
# to GitHub Pages when docs change on main.

on:
  push:
    branches: [main]
    paths: ['docs/**', 'package.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'package.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm docs:build
        env:
          # Project site (https://<owner>.github.io/nest-decisions/). For an organization root site
          # or a custom domain, set the repository variable DOCS_BASE to "/".
          DOCS_BASE: ${{ vars.DOCS_BASE || '/nest-decisions/' }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
