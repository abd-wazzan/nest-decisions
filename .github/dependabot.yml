version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      tooling:
        patterns: ['@biomejs/*', 'vitest', '@vitest/*', 'typescript', 'tsx']
    ignore:
      # The peer range is a compatibility promise; bump it deliberately, not by bot.
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
