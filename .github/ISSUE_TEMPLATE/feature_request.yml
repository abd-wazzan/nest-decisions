name: Feature request
description: Suggest an addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the decision you want to make and what you do today (a regex, an `if`, a model call).
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
